<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phân Tích Ảnh Y Tế</title>
  <link href="./styles/app.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- Sidebar -->
  <button id="toggleSidebarBtn" class="fixed">☰</button>
  <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-gray-800 text-white p-4">
    <h2 id="greeting" class="text-xl font-bold mb-4"></h2>
    <nav>
      <ul>
        <li><a href="index.html" class="block p-2 rounded bg-gray-600">🏠 Trang Chủ</a></li>
        <li><a href="analysis.html" class="block p-2 rounded hover:bg-gray-700">📊 Phân Tích</a></li>
        <li><a href="history.html" class="block p-2 rounded hover:bg-gray-700">🕒 Lịch sử</a></li>
        <li><a href="image.html" class="block p-2 rounded hover:bg-gray-700">📷 Phân tích ảnh</a></li>
        <li><a href="#" class="block p-2 rounded hover:bg-gray-700">👤 Người Dùng</a></li>
      </ul>
    </nav>
    <hr class="my-6">
    <div class="mb-4">
      <label for="userSelect" class="block text-sm font-medium">👤 Chọn Người Dùng</label>
      <select id="userSelect" class="w-full bg-gray-700 text-white border rounded p-2">
        <option value="user1">user1</option>
        <option value="user2">user2</option>
        <option value="user3">user3</option>
      </select>
    </div>
    <div class="mb-4">
      <p><strong>Tên:</strong> <span id="userName">Nguyễn Văn A</span></p>
      <p><strong>Tuổi:</strong> <span id="userAge">30</span></p>
      <p><strong>Địa chỉ:</strong> <span id="userAddress">123 Đường ABC, Quận XYZ, Thành phố ABC</span></p>
      <p><strong>Giới tính:</strong> <span id="userGender">Nam</span></p>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="ml-64 p-4">
    <div class="container mx-auto">
      <h1 class="text-2xl font-bold mb-4">🧠 Phân Tích Ảnh Y Tế</h1>
      <div class="mb-4">
        <label for="imageType" class="block text-sm font-medium">Chọn loại ảnh</label>
        <select id="imageType" class="w-full border rounded p-2">
          <option value="X-Ray">X-Ray</option>
          <option value="MRI">MRI</option>
          <option value="Ultrasound">Ultrasound</option>
          <option value="CT" selected>CT</option>
        </select>
      </div>
      <div class="mb-4">
        <label for="bodyPart" class="block text-sm font-medium">Chọn bộ phận</label>
        <select id="bodyPart" class="w-full border rounded p-2">
          <option value="Ngực">Ngực</option>
          <option value="Não">Não</option>
          <option value="Gan" selected>Gan</option>
          <option value="Bụng">Bụng</option>
        </select>
      </div>
      <p class="mb-4"><strong>Bạn chọn:</strong> <span id="selection">CT - Gan</span></p>
      <input type="file" id="fileInput" accept="image/jpeg,image/png" multiple class="mb-4">
      <button id="analyzeBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600" disabled>Phân tích</button>
      <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4"></div>
    </div>
  </main>

  <script src="./scripts/utils.js"></script>
  <script src="./scripts/render.js"></script>
  <script src="./scripts/image.js"></script>
</body>
</html>
