<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phân Tích Ảnh Y Tế</title>
  <link href="./styles/app.css" rel="stylesheet">
  <link href="./styles/image.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- Sidebar -->
  <button id="toggleSidebarBtn" class="fixed">☰</button>
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <main class="ml-64 p-4">
    <div id="theme-container"></div>
    <div class="container mx-auto">
      <h1 class="text-2xl font-bold mb-4">🧠 Phân Tích Ảnh Y Tế</h1>
      <div class="mb-4">
        <label for="imageType" class="block text-sm font-medium">Chọn loại ảnh</label>
        <select id="imageType" class="w-full border rounded p-2">
          <option value="X-Ray">X-Ray</option>
          <option value="MRI">MRI</option>
          <option value="Ultrasound">Ultrasound</option>
          <option value="CT" selected>CT</option>
        </select>
      </div>
      <div class="mb-4">
        <label for="bodyPart" class="block text-sm font-medium">Chọn bộ phận</label>
        <select id="bodyPart" class="w-full border rounded p-2">
          <option value="Chest">Ngực</option>
          <option value="Brain">Não</option>
          <option value="Liver" selected>Gan</option>
          <option value="Abdomen">Bụng</option>
        </select>
      </div>
      <p class="mb-4"><strong>Bạn chọn:</strong> <span id="selection">CT - Gan</span></p>
      <input type="file" id="fileInput" accept="image/jpeg,image/png" multiple class="mb-4">
      <button id="analyzeBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 disabled:bg-gray-400" disabled>Phân tích</button>
      <div id="loading" class="hidden text-blue-600 mt-2">Đang phân tích...</div>
      <div id="error" class="hidden text-red-600 mt-2"></div>
      <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4"></div>
    </div>
  </main>
  <script type="module">
      import { createSidebar } from './scripts/components/sidebar.js';
      import { initTheme } from './scripts/theme.js';
      const sidebarContainer = document.getElementById('sidebar-container');
      sidebarContainer.appendChild(createSidebar());
      initTheme('theme-container');
  </script>
  <script type="module" src="./scripts/utils.js"></script>
  <script type="module" src="./scripts/render.js"></script>
  <script type="module" src="./scripts/image.js"></script>
</body>
</html>
