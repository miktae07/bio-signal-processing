<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Dữ Liệu</title>
    <link href="./styles/app.css" rel="stylesheet">
    <link href="./styles/history.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
</head>
<body class="min-h-screen bg-gray-100">
    <!-- Sidebar -->
    <button id="toggleSidebarBtn" class="fixed">☰</button>
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="ml-64 p-4">
        <div id="theme-container"></div>
        <div class="container mx-auto">
            <h1 class="text-3xl font-bold text-gray-900 mb-4">🕒 Lịch Sử Dữ Liệu</h1>
            <div id="error" class="text-red-600 hidden"></div>
            
            <!-- Date and Time Filters -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label for="startDate" class="block text-sm font-medium text-gray-700">📅 Từ ngày</label>
                    <input type="date" id="startDate" class="w-full bg-white border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                    <label for="startTime" class="block text-sm font-medium text-gray-700 mt-2">⏰ Từ giờ</label>
                    <input type="time" id="startTime" class="w-full bg-white border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="endDate" class="block text-sm font-medium text-gray-700">📅 Đến ngày</label>
                    <input type="date" id="endDate" class="w-full bg-white border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                    <label for="endTime" class="block text-sm font-medium text-gray-700 mt-2">⏰ Đến giờ</label>
                    <input type="time" id="endTime" class="w-full bg-white border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Sensor Selection -->
            <div class="mb-6">
                <label for="sensorSelect" class="block text-sm font-medium text-gray-700">🔎 Chọn cảm biến</label>
                <select id="sensorSelect" required class="w-full bg-white border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 h-32 overflow-y-auto">
                    <!-- Options sẽ được thêm động bởi JavaScript -->
                </select>
            </div>

            <!-- Load Data Button -->
            <button id="loadDataBtn" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition duration-200 mb-6 mt-6">📤 Tải dữ liệu</button>

            <!-- Charts and Tables -->
            <div id="historyContent"></div>
        </div>

        <!-- Scripts -->
        <script type="module">
            import { createSidebar } from './scripts/components/sidebar.js';
            import { initTheme } from './scripts/theme.js';
            const sidebarContainer = document.getElementById('sidebar-container');
            sidebarContainer.appendChild(createSidebar());
            initTheme('theme-container');
        </script>
        <script src="./scripts/firebase_utils.js"></script>
        <script src="./scripts/utils.js"></script>
        <script type="module" src="./scripts/render.js"></script>
        <script type="module" src="./scripts/main.js"></script>
        <script src="./scripts/history.js"></script>
    </main>
</body>
</html>
