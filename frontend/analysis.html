<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân Tích Dữ Liệu Y Tế</title>
    <link href="./styles/app.css" rel="stylesheet">
    <link href="./styles/history.css" rel="stylesheet">
    <link href="./styles/analysis.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
</head>
<body class="min-h-screen bg-gray-100">
    <!-- Sidebar -->
    <aside class="fixed top-0 left-0 w-64 h-full bg-gray-800 text-white p-4">
        <h2 id="greeting" class="text-xl font-bold mb-4"></h2>
        <nav>
            <ul>
                <li><a href="index.html" class="block p-2 rounded hover:bg-gray-700">🏠 Trang Chủ</a></li>
                <li><a href="analysis.html" class="block p-2 rounded bg-gray-600">📊 Phân Tích</a></li>
                <li><a href="history.html" class="block p-2 rounded hover:bg-gray-700">🕒 Lịch Sử</a></li>
                <li><a href="image.html" class="block p-2 rounded hover:bg-gray-700">📷 Phân Tích Ảnh</a></li>
                <li><a href="#" class="block p-2 rounded hover:bg-gray-700">👤 Người Dùng</a></li>
            </ul>
        </nav>
        <hr class="my-4 border-gray-600">
        <div class="mb-4">
            <label for="userSelect" class="block text-sm font-medium">👤 Chọn Người Dùng</label>
            <select id="userSelect" class="w-full bg-gray-700 text-white border rounded p-2">
                <option value="user1">user1</option>
                <option value="user2">user2</option>
                <option value="user3">user3</option>
            </select>
        </div>
        <div class="mb-4">
            <p><strong>Tên:</strong> <span id="userName">Nguyễn Văn A</span></p>
            <p><strong>Tuổi:</strong> <span id="userAge">30</span></p>
            <p><strong>Địa chỉ:</strong> <span id="userAddress">123 Đường ABC, Quận XYZ, Thành phố ABC</span></p>
            <p><strong>Giới tính:</strong> <span id="userGender">Nam</span></p>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="ml-64 p-4">
        <div class="container mx-auto">
            <h1 class="text-3xl font-bold text-gray-900 mb-4">📊 Phân Tích Dữ Liệu Y Tế</h1>
            <div id="error" class="text-red-600 hidden"></div>
            
            <!-- Signal Selection -->
            <!-- Trong <div class="mb-6" của tín hiệu phân tích -->
          <!-- Thay thế phần <div class="mb-6"> cho tín hiệu phân tích -->
          <div class="mb-6">
              <label for="signalSelect" class="block text-sm font-medium text-gray-700">🔍 Chọn tín hiệu phân tích</label>
              <select id="signalSelect" required class="w-full bg-white border border-gray-30 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 invalid:border-red-500 invalid:bg-red-50" data-placeholder="Chọn tín hiệu">
                  <!-- Options will be populated dynamically by JavaScript -->
              </select>
              <span id="signalError" class="text-red-600 text-sm hidden">Vui lòng chọn ít nhất một tín hiệu!</span>
          </div>

            <!-- Date and Time Filters -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label for="startDate" class="block text-sm font-medium text-gray-700">📅 Ngày bắt đầu</label>
                    <input type="date" id="startDate" class="w-full bg-white border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                    <label for="startTime" class="block text-sm font-medium text-gray-700 mt-2">⏰ Giờ bắt đầu</label>
                    <input type="time" id="startTime" class="w-full bg-white border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="endDate" class="block text-sm font-medium text-gray-700">📅 Ngày kết thúc</label>
                    <input type="date" id="endDate" class="w-full bg-white border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                    <label for="endTime" class="block text-sm font-medium text-gray-700 mt-2">⏰ Giờ kết thúc</label>
                    <input type="time" id="endTime" class="w-full bg-white border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Analyze Button -->
            <button id="analyzeBtn" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition duration-200 mb-6">🔍 Chạy phân tích</button>

            <!-- Charts and Tables -->
            <div id="analysisContent"></div>
        </div>

        <!-- Scripts -->
        <script src="./scripts/firebase_utils.js"></script>
        <script src="./scripts/utils.js"></script>
        <script src="./scripts/render.js"></script>
        <script src="./scripts/main.js"></script>
        <script src="./scripts/analysis.js"></script>
    </main>
</body>
</html>
