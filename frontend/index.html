<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Chăm Sóc Sức Khỏe Đa Kênh Thời Gian Thực</title>
    <link href="./styles/app.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
</head>
<body class="min-h-screen bg-gray-100">
    <!-- Sidebar -->
    <button id="toggleSidebarBtn" class="fixed">☰</button>
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="ml-64 p-4">
        <div id="theme-container"></div>
        <div class="container mx-auto">
            <h1 class="text-3xl font-bold mb-4">🏠 Trang chủ – Hiển Thị Dữ Liệu</h1>
            <div class="flex justify-end mb-4">
                <button id="customizeBtn" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                    ⚙️ Tuỳ chọn hiển thị
                </button>
            </div>
            <div id="error" class="text-red-600 hidden"></div>
            <h2 class="text-2xl font-semibold mt-6 mb-4">📊 Dữ liệu Hiện Tại</h2>
            <div id="metrics" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            <hr class="my-6">
            <h2 class="text-2xl font-semibold mb-4">📈 Biểu Đồ Biến Thiên</h2>
            <div id="charts"></div>
        </div>

        <!-- Modal for Customize -->
        <div id="customizeModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center hidden">
            <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
                <h3 class="text-xl font-semibold mb-4">Chọn tín hiệu để hiển thị</h3>
                <div id="sensorCheckboxes" class="space-y-2"></div>
                <div class="mt-6 flex justify-end space-x-2">
                    <button id="cancelCustomize" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">Hủy</button>
                    <button id="saveCustomize" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">Lưu</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script type="module">
        import { createSidebar } from './scripts/components/sidebar.js';
        import { initTheme } from './scripts/theme.js';
        const sidebarContainer = document.getElementById('sidebar-container');
        sidebarContainer.appendChild(createSidebar());
        initTheme('theme-container');
    </script>
    <script src="./scripts/firebase_utils.js"></script>
    <script src="./scripts/utils.js"></script>
    <script src="./scripts/render.js"></script>
    <script type="module" src="./scripts/main.js"></script>
</body>
</html>
